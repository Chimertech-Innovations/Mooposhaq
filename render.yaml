services:
  - type: web
    name: feednutrition-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: BCS_MODEL_API_URL
        value: ""
      - key: MASTITIS_MODEL_API_URL
        value: ""
      - key: DISEASE_MODEL_API_URL
        value: ""
    autoDeploy: true
    plan: free
